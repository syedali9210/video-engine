const floorRender = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.ShaderMaterial({

  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 uHaze, uBase; uniform vec2 uSp, uOff, uRes; varying vec3 vW;

    vec3 lineCol(float r){ return r < .45 ? vec3(.05,1.,.25) : r < .7 ? vec3(.45,.3,1.) : r < .85 ? vec3(.8,.25,.9) : vec3(.35,.35,.7); }

      vec2 fw = fwidth(p) * 1.8; vec2 d = abs(fract(p - .5) - .5) / fw;

    const p = pts[i], a = pts[(i + 3) % 4], b = pts[(i + 1) % 4];
    const p1 = p.clone().add(a.clone().sub(p).normalize().multiplyScalar(r)), p2 = p.clone().add(b.clone().sub(p).normalize().multiplyScalar(r));
    if (i === 0) s.moveTo(p1.x, p1.y); else s.lineTo(p1.x, p1.y);
    s.quadraticCurveTo(p.x, p.y, p2.x, p2.y);
  }
  s.closePath(); return s;
})();
const bandGeo = new THREE.ExtrudeGeometry(bandShape, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.015, bevelSegments: 6, curveSegments: 8 });
bandGeo.translate(0, 0, -0.05);
const BAND_LIFT = 0.021; // measured: screen centroid matched to the plate
const bandGroup = new THREE.Group(); bandGroup.position.set(0.008, BAND_YC + BAND_LIFT, 0); torso.add(bandGroup);
const FUR_N = 18;
const furMats = [];
const furVS = `uniform float uShell, uLen; varying vec3 vN; varying vec3 vP; varying float vS;
void main(){ vec3 p = position + normal * uShell * uLen; p.y -= uShell * uShell * uLen * .35;
  vN = normalize(normalMatrix * normal); vP = position; vS = uShell; gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.); }`;
const furFS = `uniform vec3 uRoot, uTip, uL; uniform float uDensity, uShell, uLit, uSpeck;
varying vec3 vN; varying vec3 vP; varying float vS;
float h3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
void main(){
  vec3 cell = floor(vP * uDensity);
  float r = h3(cell);
  if(uShell > 0. && r < uShell * 1.05) discard;
  vec3 n = normalize(vN);
  float l = mix(1., .45 + .75 * max(dot(n, uL), 0.) + .35 * pow(1. - abs(n.z), 2.), uLit);
  vec3 c = mix(uRoot, uTip, pow(vS, .7)) * l * mix(.72, 1.12, smoothstep(-.05, .05, vP.y)); // shaded underside, lit top edge
  if(uSpeck > 0. && h3(cell + 3.1) < uSpeck) c *= .25;
  gl_FragColor = vec4(c, 1.);
}`;
for (let i = 0; i <= FUR_N; i++) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uShell: { value: i / FUR_N }, uLen: { value: 0.018 }, uDensity: { value: 560 }, uRoot: { value: col('#a9801a') }, uTip: { value: col('#ffe463') },
      uL: { value: new THREE.Vector3(0.2, 0.9, 0.5).normalize() }, uLit: { value: 1 }, uSpeck: { value: 0 } },
    vertexShader: furVS, fragmentShader: furFS,
  });
  furMats.push(m);
  bandGroup.add(new THREE.Mesh(bandGeo, m));
}

// limbs: noodle tubes rebuilt every frame through the traced joints
// velvet noodle: sheen gives the soft fuzzy rim the render has
const limbLit = new THREE.MeshPhysicalMaterial({ color: '#3ea06f', roughness: 0.8, sheen: 1, sheenColor: '#a8f0cc', sheenRoughness: 0.4, emissive: '#439067', emissiveIntensity: 0.75 });
const limbs = [0, 1, 2, 3].map(() => part(new THREE.BufferGeometry(), limbLit, hero));
const LIMB_R = [0.026, 0.026, 0.028, 0.028]; // back arm, front arm, leg A, leg B  (measured ~10 px thick)
// motion blur like the source render (~1/50 s shutter): translucent copies at +-7/14 ms
const BLUR = [-0.014, -0.007, 0.007, 0.014];
const ghostMat = std({ color: '#3ea06f', emissive: '#439067', emissiveIntensity: 0.75, roughness: 0.8, transparent: true, opacity: 0.26, depthWrite: false });
const ghostMeshes = BLUR.map(() => [0, 1, 2, 3].map(() => part(new THREE.BufferGeometry(), ghostMat, hero)));

/* ---------- sparks ---------- */
const sparks = SPARKS.map(([t, sx, sy]) => {
  const m = new THREE.SpriteMaterial({ map: canvasTex(128, 256, () => {}), color: '#aef6ff', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const s = new THREE.Sprite(m); const z = 0.6; s.position.copy(P(sx, sy, z)); s.scale.set(S(46, z), S(92, z), 1);
  s.userData = { t, seed: -1 }; scene.add(s); return s;
});
function drawSpark(s, seed) {
  const c = s.material.map.image, g = c.getContext('2d'), w = c.width, h = c.height;
  let r = seed * 9301 + 49297; const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  g.clearRect(0, 0, w, h);
  const pts = []; let x = w * (0.35 + rnd() * 0.3), y = h * 0.08;
  pts.push([x, y]); for (let i = 0; i < 5; i++) { x = w * (0.2 + rnd() * 0.6); y += h * (0.12 + rnd() * 0.08); pts.push([x, y]); }
  g.lineJoin = 'miter'; g.strokeStyle = '#fff';
  for (const [lw, blur] of [[7, 14], [3, 0]]) { g.shadowColor = 'rgba(160,240,255,.9)'; g.shadowBlur = blur; g.lineWidth = lw; g.beginPath(); pts.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.stroke(); }
  s.material.map.needsUpdate = true;
}


/* ================================================================== *
 *  ANIMATION
 * ================================================================== */
const cr = (a, b, c, d, t) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (3 * b - a - 3 * c + d) * t * t * t);
function key(arr, u) { // periodic Catmull-Rom through the 10 poses
  const n = arr.length, x = (((u % 1) + 1) % 1) * n, i = Math.floor(x), f = x - i;
  const A = arr[(i + n - 1) % n], B = arr[i], C = arr[(i + 1) % n], D = arr[(i + 2) % n];
  return B.map((_, k) => cr(A[k], B[k], C[k], D[k], f));
}
// sets the torso for loop time t and returns the 4 limb chains (world space)
function pose(t) {
  const u = t / RUN + PH0;
  const [cx, cy, roll] = key(POSE.torso, u);
  torso.position.copy(P(cx, cy, 0.02));
  torso.rotation.set(0, HERO_YAW, THREE.MathUtils.degToRad(roll), 'YXZ');
  torso.updateMatrixWorld(true);
  const L = (x, y, z) => new THREE.Vector3(x, y, z).applyMatrix4(torso.matrixWorld);
  const chain = (root, j, z) => [root, P(j[0], j[1], z), P(j[2], j[3], z), P(j[4], j[5], z)];
  return [
    chain(L(-0.26, 0.07, -0.05), key(POSE.armB, u), -0.05),
    chain(L(0.24, 0.0, -0.06), key(POSE.armF, u), -0.06),
    chain(L(-0.12, -0.27, 0.03), key(POSE.legA, u), 0.05),
    chain(L(-0.05, -0.28, -0.03), key(POSE.legB, u), -0.05),
  ];
}
// limb = tube through the joints + a round root cap + a hand ball (arms) or a boot capsule along the foot (legs)
const UP = new THREE.Vector3(0, 1, 0);
function limbGeo(pts, r, isLeg) {
  const tubeG = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'centripetal'), 40, r, 14, false);
  const root = new THREE.SphereGeometry(r, 14, 10).translate(pts[0].x, pts[0].y, pts[0].z);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  let end;
  if (isLeg) {
    end = new THREE.CapsuleGeometry(r * 1.3, a.distanceTo(b), 6, 14).scale(1, 1, 1.15);
    end.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(UP, b.clone().sub(a).normalize()));
    end.translate((a.x + b.x) / 2, (a.y + b.y) / 2 - r * 0.25, (a.z + b.z) / 2);
  } else end = new THREE.SphereGeometry(r * 1.2, 14, 10).translate(b.x, b.y, b.z);
  const g = mergeGeometries([tubeG.toNonIndexed(), root.toNonIndexed(), end.toNonIndexed()]);
  [tubeG, root, end].forEach(x => x.dispose());
  return g;
}
function setTube(mesh, pts, r, i) { mesh.geometry.dispose(); mesh.geometry = limbGeo(pts, r, i >= 2); }
const codeAlpha = (t) => (t < 0.25 ? 1 : Math.max(0, 1 - (t - 0.25) / 1.1));

function update(t) {
  BLUR.forEach((dt, k) => pose(t + dt).forEach((pts, i) => setTube(ghostMeshes[k][i], pts, LIMB_R[i], i)));
  const chains = pose(t);
  chains.forEach((pts, i) => setTube(limbs[i], pts, LIMB_R[i], i));
  // treadmill bounce, console lean, bottle lag - keyed to the same stride phase as the runner
  const u = t / RUN + PH0, k1 = (arr) => key(arr.map(v => [v]), u)[0];
  const [c0, c1, c2] = key(SHAKE.tm, u);
  tmRig.position.y = tmRig.userData.rest.y - S(c0, TZ);   // dip
  tmRig.rotation.z = -c1 / 100;                            // tilt: screen px per px == world m per m at one depth
  tmRig.scale.y = 1 + c2 / 100;                            // squash toward the floor
  const [bandTilt, bandSlide] = key(SHAKE.band, u);
  bandGroup.rotation.z = -0.2 + THREE.MathUtils.degToRad(bandTilt);
  bandGroup.position.y = BAND_YC + BAND_LIFT + bandSlide;
  const lean = -k1(SHAKE.armDx) / 112;                    // arm tip sits 112 px above the upright's foot
  conRig.rotation.z = lean;
  const [bx, by] = key(SHAKE.bottle, u);
  bottleRig.position.copy(bottleRig.userData.rest).add(new THREE.Vector3(S(bx, 0.02), -S(by, 0.02), 0));
  bottleRig.rotation.z = -(bx + 115 * lean) * 0.008;      // lean into its lag relative to the console
  beltTex.offset.x = ((t * BELT_SPEED / SLAT) % 1 + 1) % 1;
  bg.material.uniforms.uTop.value = codeAlpha(t);
  for (const s of sparks) {
    const d = t - s.userData.t, on = d >= 0 && d < 0.12;
    s.visible = on;
    if (on) { const seed = Math.floor(d * 25) + Math.round(s.userData.t * 100); if (seed !== s.userData.seed) { s.userData.seed = seed; drawSpark(s, seed); } }
  }
}

scene.traverse(o => {
  if (!o.isMesh || !o.material || Array.isArray(o.material) && !o.material[0].isMeshStandardMaterial) return;
  const m = Array.isArray(o.material) ? o.material[0] : o.material;
  if ((m.isMeshStandardMaterial || m.isShaderMaterial && o.parent === torso) && !m.transparent) { o.castShadow = true; o.receiveShadow = m.isMeshStandardMaterial; }
});
limbs.forEach(l => { l.castShadow = true; l.receiveShadow = true; });
if (frontRim) frontRim.receiveShadow = false;

/* ---------- render ---------- */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W * PR, H * PR, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W * PR, H * PR), 0.55, 0.4, 0.72));
composer.addPass(new OutputPass());
function renderAt(t) { update(t); composer.render(); }

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fixed = qs.has('t') ? +qs.get('t') : null;
// source frame file -> loop time. The clip is a 25 fps render screen-recorded at 30 fps, so the traced stride's
// frames map to their pose directly; other files fall back to capture time.
const POSE_FILES = [277, 278, 279, 280, 281, 283, 284, 285, 286, 288];
const srcToT = (n) => { const k = POSE_FILES.indexOf(+n), t = k >= 0 ? (k / 10 - PH0) * RUN : (+n - 1) / 30 - 9.467; return ((t % LOOP) + LOOP) % LOOP; };
if (qs.has('ref')) {
  const n = qs.get('ref'), ref = document.getElementById('ref'), img = ref.querySelector('img');
  img.src = `ref/${n}.png`; ref.style.display = 'block'; ref.style.opacity = qs.get('op') ?? '0.5';
}
const refT = qs.has('ref') && fixed === null ? srcToT(qs.get('ref')) : null;
let t0 = null;
function frame(now) {
  if (t0 === null) t0 = now;
  renderAt(fixed ?? refT ?? (reduce ? 0.9 : ((now - t0) / 1000) % LOOP));
  if (fixed === null && refT === null && !reduce) requestAnimationFrame(frame);
}
document.fonts.load(codeFont(24)).catch(() => {}).finally(() => {
  buildCodeTextures();
  requestAnimationFrame(frame);
});
</script>
