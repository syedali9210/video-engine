<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The engine's Canvas shows this page on every device: a canvas embedded in a page the way a site would embed it,
         as the hero, with a page to scroll under it. The canvas comes packed in the hash (#z=). -->
    <title>A page with the canvas</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --bar: #e7e7ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0c;
          --bar: #1e1e22;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: clamp(32px, 6vw, 64px) clamp(16px, 4vw, 40px) 120px;
      }
      .bar {
        height: 10px;
        margin: 12px 0;
        border-radius: 5px;
        background: var(--bar);
      }
    </style>
  </head>
  <body>
    <div id="canvas"></div>
    <main aria-hidden="true">
      <div class="bar" style="width: 42%; height: 22px"></div>
      <div class="bar" style="width: 92%"></div>
      <div class="bar" style="width: 86%"></div>
      <div class="bar" style="width: 64%"></div>
      <div class="bar" style="width: 90%; margin-top: 40px"></div>
      <div class="bar" style="width: 78%"></div>
      <div class="bar" style="width: 84%"></div>
      <div class="bar" style="width: 52%"></div>
    </main>
    <script type="module">
      import { mount, unpack } from "/canvas.js"
      let canvas
      // the editor changes only the hash as the canvas changes: the canvas follows it without a reload. #src= is a
      // canvas's JSON at an address on this site (what the MCP server hands over)
      async function show() {
        const z = /(?:^|[#&])z=([\w-]+)/.exec(location.hash)?.[1]
        const src = /(?:^|[#&])src=(\/[^&]+)/.exec(location.hash)?.[1]
        if (!z && !src) return
        const doc = z ? await unpack(z) : await (await fetch(decodeURIComponent(src))).json()
        if (canvas) canvas.update(doc)
        else canvas = mount(document.getElementById("canvas"), doc)
      }
      addEventListener("hashchange", show)
      show()
    </script>
  </body>
</html>
